profile: "balanced"
project_root: "."
path_base: "config_dir"

database:
  db_path: ".lancedb"
  table_name: "project_kb"
  manifest_path: ".lancedb/manifest.json"
  vector_dimension: 1024
  extracted_cache_dir: ".kb_cache/extracted"
  multimodal_cache_dir: ".kb_cache/multimodal"
  index_role: "curated"

scan:
  source_dirs:
    - docs
  include_patterns:
    - "**/*.md"
    - "**/*.csv"
    - "**/*.yaml"
    - "**/*.yml"
  exclude_patterns:
    - "docs/.obsidian/**"
    - "docs/_attachments/**"
    - "docs/_templates/**"
    - "docs/99_Inbox/**"
    - "docs/_generated/visual_summaries/needs_review/**"
    - "docs/_generated/**/needs_review/**"
    - ".git/**"
    - ".venv/**"
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "__pycache__/**"
    - ".lancedb/**"
    - ".kb_cache/**"
    - ".codex/**"

chunking:
  chunk_size: 1000
  chunk_overlap: 120

embedding:
  model_name: "BAAI/bge-m3"
  batch_size: 4
  device: null
  use_fp16: null

parsing:
  ocr:
    enabled: false
    engine: "rapidocr"
    min_text_chars_per_page: 30
    max_pages_per_file: 300
    image_dpi: 180
    languages: ["ch", "en"]
  office:
    extract_images: false
    extract_notes: true
    max_sheet_rows: 20000
    xlsx_rows_per_section: 500
  multimodal:
    enabled: false
    attachments_dir: "docs/_attachments/kb_assets"
    pdf:
      extract_embedded_images: false
      render_pages: "off"
      render_dpi: 180
      max_rendered_pages_per_file: 30
      max_visual_assets_per_file: 200
      min_page_text_chars: 80
      min_drawing_count_for_render: 8
      min_image_area_ratio_for_render: 0.25
    images:
      min_image_width: 256
      min_image_height: 256
      skip_small_icons: true
      skip_near_blank_images: true
      skip_logo_like_images: true
      max_image_pixels: 16000000
      deduplicate_by_hash: true
    vision:
      enabled: false
      provider: "ocr_only"
      model: null
      base_url: null
      api_key_env: "OPENAI_API_KEY"
      allow_external_vision: false
      cache_by_hash: true
      prompt_version: "vision-caption-v1"
      max_caption_chars: 4000
      max_ocr_chars: 4000
      max_upload_pixels: 4000000
      max_upload_bytes: 5000000
      resize_long_edge: 1600
      jpeg_quality: 85
      timeout: 60
      max_retries: 1
    curated_attachments:
      mode: "off"
      allowed_roots:
        - "docs/_attachments/kb_assets"

retrieval:
  mode: "hybrid"
  top_k: 5
  candidate_k: 20
  max_concurrent_queries: 1
  high_precision: false
  reranker: "rrf"
  reranker_model_name: "BAAI/bge-reranker-v2-m3"
  rerank_top_k: 40
  fallback_reranker: "rrf"
  boosts:
    enabled: true
    rules:
      - name: "risk-register"
        query_terms: ["risk", "风险", "严重", "severity", "owner"]
        source_globs: ["*风险*.csv", "*risk*.csv", "*risk-register*", "*/风险/*"]
        weight: 0.12
      - name: "meeting-notes"
        query_terms: ["会议", "纪要", "standup", "对账", "负责"]
        source_globs: ["*会议纪要*", "*standup*", "*meeting*", "*/会议纪要/*"]
        weight: 0.08
      - name: "standup-reconciliation"
        query_terms: ["对账", "reconciliation", "payment status", "支付状态"]
        source_globs: ["*standup*", "*daily*"]
        weight: 0.10
      - name: "milestones"
        query_terms: ["milestone", "里程碑", "关键里程碑", "计划", "日期"]
        source_globs: ["*milestone*", "*里程碑*", "*/配置/milestones.*"]
        weight: 0.12
      - name: "code-api"
        query_terms: ["api", "endpoint", "route", "接口", "returns"]
        source_globs: ["*/代码/*", "*/code/*", "*.py", "*.ts", "*.tsx", "*.js"]
        weight: 0.08
      - name: "architecture"
        query_terms: ["adr", "architecture", "架构", "schema", "table", "事件驱动"]
        source_globs: ["*/架构/*", "*/architecture/*", "*.sql", "*architecture*"]
        weight: 0.08
      - name: "requirements"
        query_terms: ["scope", "需求", "范围", "mvp", "out of scope", "不属于"]
        source_globs: ["*/需求/*", "*/requirements/*", "*scope*"]
        weight: 0.06
  max_snippet_chars: 320
  max_return_chars: 6000

curation:
  index_review_statuses:
    - reviewed
    - approved
  skip_needs_review: true
  index_non_searchable_visual_summaries: false
  curated_data_dirs:
    - docs/_curated_data
