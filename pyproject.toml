[project]
name = "project-kb-template"
version = "0.1.0"
description = "Copyable local project knowledge base template with Office parsing, OCR, LanceDB hybrid search, and read-only MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lancedb>=0.22.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.6.0",
  "pyyaml>=6.0.1",
  "FlagEmbedding>=1.4.0,<1.5.0",
  "sentence-transformers>=3.0.0,<6.0.0",
  "transformers>=4.44.0,<5.0.0",
  "mcp[cli]>=1.9.0",
  "rich>=13.7.0",
  "tqdm>=4.66.0",
  "pymupdf>=1.24.0",
  "python-pptx>=1.0.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
ocr = [
  "rapidocr>=3.8.0",
  "rapidocr-onnxruntime>=1.4.4",
]
